<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rolezeiro — Descubra. Conecte-se. Viva.</title>
<meta name="description" content="A rede social dos fãs de música brasileira. Descubra shows, festivais e conecte-se com outros fãs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%9F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="header-inner">
    <button class="icon-btn only-mobile" id="btn-mobile-menu" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <a class="logo" href="#/">Rolezeiro<span class="logo-dot">.</span></a>

    <nav class="nav-desktop" id="nav-desktop">
      <a data-route="#/" class="nav-link">Início</a>
      <a data-route="#/discover" class="nav-link">Descobrir</a>
      <a data-route="#/events" class="nav-link">Eventos</a>
      <a data-route="#/communities" class="nav-link">Comunidades</a>
      <a data-route="#/meu-role" class="nav-link">Meu Rolê</a>
    </nav>

    <form class="header-search" id="global-search-form" role="search">
      <svg viewBox="0 0 24 24" class="search-icon"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="global-search-input" placeholder="Buscar artistas, shows, festivais, cidades...">
    </form>

    <div class="header-actions">
      <button class="icon-btn" id="btn-theme" aria-label="Alternar tema" title="Alternar tema claro/escuro">
        <svg viewBox="0 0 24 24" id="icon-theme"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn has-badge" id="btn-notifs" aria-label="Notificações">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="badge" id="notif-badge" hidden>0</span>
      </button>
      <button class="user-chip" id="btn-user">
        <span class="avatar avatar-sm" id="user-avatar">?</span>
        <span class="only-desktop" id="user-chip-label">Entrar</span>
      </button>
    </div>
  </div>
</header>

<!-- ===== MAIN APP ROOT (renderizado via JS) ===== -->
<main id="app-root" class="app-root"></main>

<!-- ===== BOTTOM NAV MOBILE ===== -->
<nav class="nav-mobile" id="nav-mobile">
  <a data-route="#/" class="nav-mobile-link">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span>Início</span>
  </a>
  <a data-route="#/discover" class="nav-mobile-link">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>Descobrir</span>
  </a>
  <a data-route="#/events" class="nav-mobile-link nav-mobile-cta">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>Eventos</span>
  </a>
  <a data-route="#/communities" class="nav-mobile-link">
    <svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M2 20c0-3 2.5-5 6-5s6 2 6 5M14 20c0-2.2 1.7-4 4.5-4S23 17.8 23 20"/></svg>
    <span>Comunidades</span>
  </a>
  <a data-route="#/perfil" class="nav-mobile-link">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    <span>Perfil</span>
  </a>
</nav>

<!-- ===== OVERLAY / DRAWERS / MODALS ===== -->
<div class="overlay" id="overlay" hidden></div>

<aside class="drawer" id="mobile-menu-drawer" hidden>
  <nav class="drawer-nav">
    <a data-route="#/" class="drawer-link">Início</a>
    <a data-route="#/discover" class="drawer-link">Descobrir</a>
    <a data-route="#/events" class="drawer-link">Eventos</a>
    <a data-route="#/communities" class="drawer-link">Comunidades</a>
    <a data-route="#/meu-role" class="drawer-link">Meu Rolê</a>
    <a data-route="#/perfil" class="drawer-link">Perfil</a>
    <a data-route="#/organizador" class="drawer-link">Sou organizador</a>
    <a data-route="#/admin" class="drawer-link">Administração</a>
  </nav>
</aside>

<aside class="panel notif-panel" id="notif-panel" hidden>
  <div class="panel-head">
    <h3>Notificações</h3>
    <button class="icon-btn" id="notif-close" aria-label="Fechar">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="panel-body" id="notif-list"></div>
</aside>

<div class="modal" id="auth-modal" hidden>
  <div class="modal-card modal-card--auth" id="auth-modal-card"></div>
</div>

<div class="modal" id="quick-preview-modal" hidden>
  <div class="modal-card modal-card--preview" id="quick-preview-card"></div>
</div>

<div class="toast-root" id="toast-root"></div>

<script src="js/app.js?v=2"></script>
</body>
</html>
