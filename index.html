<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rolezeiro — Descubra. Conecte-se. Viva.</title>
<meta name="description" content="A rede social dos fãs de música brasileira. Descubra shows, festivais e conecte-se com outros fãs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%9F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ROLEZEIRO — Design System
   Paleta: violeta-noite + magenta de palco + âmbar de ingresso
   Tipografia: Space Grotesk (display) + Inter (corpo)
   ========================================================= */

*, *::before, *::after { box-sizing: border-box; }

:root[data-theme="dark"]{
  --bg: #0E0B14;
  --bg-soft: #131020;
  --surface: #1B1526;
  --surface-2: #241C33;
  --surface-hover: #2B2140;
  --border: rgba(245,241,250,0.09);
  --border-strong: rgba(245,241,250,0.16);
  --text: #F5F1FA;
  --text-muted: #ACA3C0;
  --text-faint: #6E6685;
  --pink: #FF3D7F;
  --pink-rgb: 255,61,127;
  --amber: #FFB238;
  --amber-rgb: 255,178,56;
  --violet: #8B5CF6;
  --violet-rgb: 139,92,246;
  --green-live: #2ED988;
  --shadow-lg: 0 24px 70px rgba(0,0,0,0.5);
  --shadow-md: 0 12px 32px rgba(0,0,0,0.38);
  --hero-scrim: linear-gradient(180deg, rgba(14,11,20,0.15) 0%, rgba(14,11,20,0.55) 55%, #0E0B14 100%);
}
:root[data-theme="light"]{
  --bg: #FAF7FC;
  --bg-soft: #F1ECF7;
  --surface: #FFFFFF;
  --surface-2: #F4EFFA;
  --surface-hover: #ECE4F7;
  --border: rgba(30,15,45,0.09);
  --border-strong: rgba(30,15,45,0.16);
  --text: #1B1424;
  --text-muted: #675E78;
  --text-faint: #948BA6;
  --pink: #DE1466;
  --pink-rgb: 222,20,102;
  --amber: #C97A00;
  --amber-rgb: 201,122,0;
  --violet: #6D28D9;
  --violet-rgb: 109,40,217;
  --green-live: #12915A;
  --shadow-lg: 0 24px 60px rgba(40,20,60,0.14);
  --shadow-md: 0 10px 26px rgba(40,20,60,0.10);
  --hero-scrim: linear-gradient(180deg, rgba(250,247,252,0.05) 0%, rgba(250,247,252,0.65) 60%, #FAF7FC 100%);
}

html{ scroll-behavior:smooth; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:15.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{ font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; margin:0; }
p{ margin:0; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
input,select,textarea{ font-family:inherit; }
ul{ margin:0; padding:0; list-style:none; }
img{ max-width:100%; display:block; }
::selection{ background:var(--pink); color:#fff; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

/* ---------- layout shells ---------- */
.only-mobile{ display:none; }
.only-desktop{ display:inline-flex; }
@media (max-width: 880px){
  .only-mobile{ display:inline-flex; }
  .only-desktop{ display:none; }
}

.container{ max-width:1240px; margin:0 auto; padding:0 24px; }
@media (max-width:880px){ .container{ padding:0 16px; } }

/* =========================================================
   HEADER
   ========================================================= */
.site-header{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1400px; margin:0 auto; padding:12px 24px;
  display:flex; align-items:center; gap:18px;
}
.logo{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px;
  white-space:nowrap;
}
.logo-dot{ color:var(--pink); }
.nav-desktop{ display:flex; gap:4px; }
.nav-link{
  padding:9px 14px; border-radius:100px; font-weight:600; font-size:14.5px;
  color:var(--text-muted); transition:background .15s,color .15s;
}
.nav-link:hover{ background:var(--surface-2); color:var(--text); }
.nav-link.active{ background:var(--surface-2); color:var(--text); }

.header-search{
  flex:1; max-width:420px; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--border); border-radius:100px;
  padding:9px 16px; margin-left:auto;
}
.header-search .search-icon{ width:16px; height:16px; stroke:var(--text-faint); fill:none; stroke-width:2; flex:none; }
.header-search input{
  border:none; background:transparent; outline:none; color:var(--text); width:100%; font-size:14px;
}
.header-search input::placeholder{ color:var(--text-faint); }
@media (max-width:880px){ .header-search{ display:none; } }

.header-actions{ display:flex; align-items:center; gap:8px; }
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); display:flex; align-items:center; justify-content:center;
  position:relative; flex:none;
}
.icon-btn svg{ width:18px; height:18px; fill:none; stroke:var(--text); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.icon-btn:hover{ background:var(--surface-hover); }
.badge{
  position:absolute; top:-4px; right:-4px; background:var(--pink); color:#fff;
  font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:8px;
  display:flex; align-items:center; justify-content:center; padding:0 4px;
  border:2px solid var(--bg);
}
.user-chip{
  display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface);
  border-radius:100px; padding:5px 14px 5px 5px; font-weight:600; font-size:13.5px;
}
.user-chip:hover{ background:var(--surface-hover); }
.avatar{
  border-radius:50%; background:linear-gradient(135deg,var(--pink),var(--violet)); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; overflow:hidden;
}
.avatar-sm{ width:26px; height:26px; font-size:12px; }
.avatar-md{ width:40px; height:40px; font-size:15px; }
.avatar-lg{ width:88px; height:88px; font-size:30px; }
.avatar img{ width:100%; height:100%; object-fit:cover; }

/* =========================================================
   BOTTOM NAV (mobile)
   ========================================================= */
.nav-mobile{
  display:none;
}
@media (max-width:880px){
  .nav-mobile{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(16px);
    border-top:1px solid var(--border); padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-mobile-link{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--text-faint); font-size:10.5px; font-weight:600; padding:4px 0; border-radius:14px;
  }
  .nav-mobile-link svg{ width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .nav-mobile-link.active{ color:var(--pink); }
  .app-root{ padding-bottom:78px; }
}

/* =========================================================
   OVERLAY / DRAWER / PANEL / MODAL
   ========================================================= */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(2px); z-index:50;
}
.drawer{
  position:fixed; top:0; left:0; bottom:0; width:260px; background:var(--surface); z-index:55;
  padding:20px; border-right:1px solid var(--border); animation:slideInLeft .22s ease;
}
.drawer-link{ display:block; padding:12px 10px; font-weight:600; border-radius:10px; }
.drawer-link:hover{ background:var(--surface-2); }
@keyframes slideInLeft{ from{ transform:translateX(-100%); } to{ transform:translateX(0); } }

.panel{
  position:fixed; top:0; right:0; bottom:0; width:380px; max-width:92vw; background:var(--surface);
  z-index:55; border-left:1px solid var(--border); display:flex; flex-direction:column;
  animation:slideInRight .22s ease;
}
@keyframes slideInRight{ from{ transform:translateX(100%); } to{ transform:translateX(0); } }
.panel-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border); }
.panel-body{ flex:1; overflow-y:auto; padding:8px 12px; }

.modal{
  position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  background:rgba(6,4,10,0.65); backdrop-filter:blur(6px); padding:20px;
}
.modal-card{
  background:var(--surface); border-radius:24px; width:100%; max-width:460px; max-height:88vh;
  overflow-y:auto; box-shadow:var(--shadow-lg); animation:popIn .2s ease; border:1px solid var(--border);
}
.modal-card--preview{ max-width:420px; }
@keyframes popIn{ from{ transform:scale(.94); opacity:0; } to{ transform:scale(1); opacity:1; } }

/* IMPORTANTE: [hidden] tem a mesma força de uma classe no CSS — sem isso aqui,
   .modal/.panel/.drawer com "display" definido vencem o hidden e o elemento
   fica visível na tela inteira mesmo "escondido". Isso forçа o hidden a sempre vencer. */
.modal[hidden], .panel[hidden], .drawer[hidden]{ display:none !important; }

/* =========================================================
   BUTTONS
   ========================================================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:100px; border:1px solid transparent; padding:12px 22px;
  font-weight:700; font-size:14px; white-space:nowrap; transition:transform .12s, filter .12s, background .15s;
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:linear-gradient(120deg,var(--pink),#FF6B9D); color:#fff; box-shadow:0 8px 24px rgba(var(--pink-rgb),0.35); }
.btn-primary:hover{ filter:brightness(1.07); }
.btn-secondary{ background:var(--surface-2); color:var(--text); border-color:var(--border-strong); }
.btn-secondary:hover{ background:var(--surface-hover); }
.btn-ghost{ background:transparent; color:var(--text); border-color:var(--border-strong); }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-outline-pink{ background:transparent; border-color:var(--pink); color:var(--pink); }
.btn-outline-pink:hover{ background:rgba(var(--pink-rgb),0.1); }
.btn-sm{ padding:8px 16px; font-size:12.5px; }
.btn-block{ width:100%; }
.btn-icon-only{ padding:10px; border-radius:50%; }
.btn[disabled]{ opacity:.5; pointer-events:none; }
.btn-active{ background:var(--pink); color:#fff; border-color:var(--pink); }

/* =========================================================
   APP ROOT / SECTIONS
   ========================================================= */
.app-root{ min-height:70vh; }
.view{ animation:fadeIn .25s ease; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

.section{ padding:38px 0; }
.section-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; gap:12px; }
.section-title{ font-size:23px; font-weight:700; }
.section-sub{ color:var(--text-muted); font-size:13.5px; margin-top:4px; }
.section-link{ font-weight:700; font-size:13px; color:var(--pink); white-space:nowrap; }

/* ticket-perforation divider, motivo: ingressos/pulseiras do brief */
.perf-divider{
  height:1px; margin:0; border:none;
  background-image: radial-gradient(circle, var(--border-strong) 1.6px, transparent 1.6px);
  background-size: 14px 1px; background-repeat: repeat-x; background-position:center;
  opacity:.9;
}

/* =========================================================
   HERO
   ========================================================= */
.hero{
  position:relative; min-height:min(76vh, 620px); display:flex; align-items:flex-end;
  overflow:hidden; color:#fff; margin-bottom:6px;
}
.hero-bg{
  position:absolute; inset:0; background-size:cover; background-position:center;
  transform:scale(1.02);
}
.hero-scrim{ position:absolute; inset:0; background:var(--hero-scrim); }
.hero-content{ position:relative; padding:0 24px 46px; width:100%; max-width:1240px; margin:0 auto; }
.hero-eyebrow{
  display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,0.14);
  backdrop-filter:blur(6px); padding:6px 14px 6px 8px; border-radius:100px; font-size:12.5px; font-weight:700; margin-bottom:16px;
}
.hero-eyebrow .dot-live{ width:7px; height:7px; border-radius:50%; background:var(--green-live); box-shadow:0 0 0 3px rgba(46,217,136,0.25); }
.hero-title{ font-size:clamp(34px,5.6vw,62px); font-weight:700; line-height:1.02; max-width:820px; margin-bottom:16px; }
.hero-meta{ display:flex; flex-wrap:wrap; gap:10px 22px; margin-bottom:22px; font-size:14.5px; color:rgba(255,255,255,0.88); font-weight:500; }
.hero-meta span{ display:flex; align-items:center; gap:7px; }
.hero-meta svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; }
.hero-artists{ font-size:14px; color:rgba(255,255,255,0.75); margin-bottom:24px; max-width:640px; }
.hero-actions{ display:flex; gap:12px; flex-wrap:wrap; }
@media (max-width:880px){ .hero{ min-height:78vh; } }

/* =========================================================
   CARROSSEL
   ========================================================= */
.rail{ display:flex; gap:16px; overflow-x:auto; padding:4px 24px 14px; margin:0 -24px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; }
.rail::-webkit-scrollbar{ height:6px; }
.rail::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:10px; }
.rail > *{ scroll-snap-align:start; flex:none; }
@media (max-width:880px){ .rail{ padding:4px 16px 14px; margin:0 -16px; } }

/* =========================================================
   CARDS
   ========================================================= */
.card-event{
  width:270px; background:var(--surface); border:1px solid var(--border); border-radius:20px; overflow:hidden;
  transition:transform .18s, border-color .18s; position:relative; display:flex; flex-direction:column;
}
.card-event:hover{ transform:translateY(-4px); border-color:var(--border-strong); }
.card-media{ position:relative; aspect-ratio:4/3; background:linear-gradient(135deg, var(--violet), var(--pink)); overflow:hidden; }
.card-media img{ width:100%; height:100%; object-fit:cover; }
.card-genre-tag{
  position:absolute; top:10px; left:10px; background:rgba(10,8,15,0.6); backdrop-filter:blur(4px); color:#fff;
  font-size:11px; font-weight:700; padding:5px 10px; border-radius:100px;
}
.card-save{
  position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%; border:none;
  background:rgba(10,8,15,0.55); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center;
}
.card-save svg{ width:16px; height:16px; fill:none; stroke:#fff; stroke-width:2; }
.card-save.is-saved svg{ fill:var(--pink); stroke:var(--pink); }
.card-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
.card-date-chip{ font-size:11.5px; font-weight:700; color:var(--pink); text-transform:uppercase; letter-spacing:.02em; }
.card-title{ font-weight:700; font-size:15.5px; line-height:1.25; }
.card-city{ color:var(--text-muted); font-size:13px; display:flex; align-items:center; gap:5px; }
.card-city svg{ width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; }
.card-artists{ color:var(--text-faint); font-size:12px; margin-top:auto; padding-top:6px; }

.card-artist{ width:160px; text-align:center; }
.card-artist-photo{ width:160px; height:160px; border-radius:50%; overflow:hidden; border:2px solid var(--border); margin-bottom:10px; background:linear-gradient(135deg, var(--violet), var(--pink)); }
.card-artist-photo img{ width:100%; height:100%; object-fit:cover; }
.card-artist-name{ font-weight:700; font-size:14.5px; }
.card-artist-genre{ font-size:12px; color:var(--text-muted); margin-top:2px; }
.card-artist-follow{ margin-top:10px; }

.card-festival{
  width:320px; border-radius:22px; overflow:hidden; position:relative; aspect-ratio:16/10;
  display:flex; align-items:flex-end; color:#fff; background:linear-gradient(135deg, var(--violet), var(--pink));
}
.card-festival img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.card-festival::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 35%, rgba(0,0,0,0.78) 100%); }
.card-festival-body{ position:relative; padding:16px; }
.card-festival-title{ font-weight:700; font-size:18px; }
.card-festival-meta{ font-size:12.5px; opacity:.85; margin-top:4px; }

.badge-pill{
  display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:100px;
  font-size:11.5px; font-weight:700; background:var(--surface-2); border:1px solid var(--border);
}
.badge-pink{ color:var(--pink); background:rgba(var(--pink-rgb),0.12); border-color:transparent; }
.badge-amber{ color:var(--amber); background:rgba(var(--amber-rgb),0.14); border-color:transparent; }
.badge-violet{ color:var(--violet); background:rgba(var(--violet-rgb),0.14); border-color:transparent; }

/* =========================================================
   FILTERS / DISCOVER
   ========================================================= */
.filters-bar{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:16px; background:var(--surface);
  border:1px solid var(--border); border-radius:18px; margin-bottom:22px;
}
.filters-bar select, .filters-bar input[type="date"]{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:100px;
  padding:9px 14px; font-size:13px; font-weight:600;
}
.view-toggle{ display:flex; background:var(--surface-2); border-radius:100px; padding:3px; margin-left:auto; gap:2px; }
.view-toggle button{ border:none; background:transparent; padding:8px 14px; border-radius:100px; font-weight:700; font-size:12.5px; color:var(--text-muted); }
.view-toggle button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-md); }
.genre-chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
.genre-chip{
  padding:8px 16px; border-radius:100px; border:1px solid var(--border); background:var(--surface); font-weight:600; font-size:13px;
  color:var(--text-muted);
}
.genre-chip.active{ background:var(--pink); color:#fff; border-color:var(--pink); }

.results-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px; }
.empty-state{
  text-align:center; padding:60px 20px; color:var(--text-muted); background:var(--surface); border:1px dashed var(--border-strong);
  border-radius:20px;
}
.empty-state h3{ color:var(--text); margin-bottom:8px; font-size:17px; }

/* =========================================================
   MAPA (regiões estilizadas do Brasil)
   ========================================================= */
.brazil-map{
  display:grid; gap:12px; grid-template-columns:repeat(4,1fr);
  grid-template-areas:
    "norte norte nordeste nordeste"
    "centro centro nordeste nordeste"
    "centro centro sudeste sudeste"
    "sul sul sudeste sudeste";
}
.map-region{
  border-radius:18px; border:1px solid var(--border); padding:16px; min-height:92px;
  display:flex; flex-direction:column; justify-content:space-between; background:var(--surface); position:relative; overflow:hidden;
}
.map-region::before{ content:''; position:absolute; inset:0; opacity:.16; background:linear-gradient(135deg,var(--pink),var(--violet)); }
.map-region-label{ font-weight:700; font-size:14px; position:relative; }
.map-region-count{ font-size:12px; color:var(--text-muted); position:relative; }
.map-region[data-region="norte"]{ grid-area:norte; }
.map-region[data-region="nordeste"]{ grid-area:nordeste; }
.map-region[data-region="centro"]{ grid-area:centro; }
.map-region[data-region="sudeste"]{ grid-area:sudeste; }
.map-region[data-region="sul"]{ grid-area:sul; }
.map-region.active{ border-color:var(--pink); }
.map-region.active::before{ opacity:.28; }
@media (max-width:640px){
  .brazil-map{ grid-template-columns:1fr 1fr; grid-template-areas:"norte nordeste" "centro nordeste" "centro sudeste" "sul sudeste"; }
}
.map-events-list{ margin-top:20px; display:flex; flex-direction:column; gap:10px; }
.map-event-row{
  display:flex; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px;
}
.map-event-row img{ width:56px; height:56px; border-radius:10px; object-fit:cover; flex:none; }
.map-event-row .mer-info{ flex:1; min-width:0; }
.map-event-row .mer-title{ font-weight:700; font-size:13.5px; }
.map-event-row .mer-meta{ font-size:12px; color:var(--text-muted); }

/* =========================================================
   CALENDÁRIO
   ========================================================= */
.calendar-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.calendar-dow{ text-align:center; font-size:11px; font-weight:700; color:var(--text-faint); padding-bottom:6px; text-transform:uppercase; }
.calendar-day{
  aspect-ratio:1; border-radius:12px; border:1px solid var(--border); background:var(--surface); padding:6px;
  display:flex; flex-direction:column; gap:3px; font-size:12px; font-weight:600; cursor:pointer;
}

/* ---------------------------------------------------------
   2) ESTADO DA APLICAÇÃO
   --------------------------------------------------------- */
const STORAGE_KEY = 'rolezeiro_state_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed, {
      favorites:new Set(parsed.favorites||[]),
      interested:new Set(parsed.interested||[]),
      following:new Set(parsed.following||[]),
      likedPosts:new Set(parsed.likedPosts||[])
    });
  }catch(e){ return defaultState(); }
}
function defaultState(){
  return {
    theme:'dark', user:null,
    favorites:new Set(), interested:new Set(), following:new Set(), likedPosts:new Set(),
    notifications:[
      {id:'n1',icon:'bell',title:'Bem-vindo(a) ao Rolezeiro! Descubra seu próximo show.',time:'agora',unread:true},
    ]
  };
}
let STATE = loadState();
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      theme:STATE.theme, user:STATE.user,
      favorites:[...STATE.favorites], interested:[...STATE.interested],
      following:[...STATE.following], likedPosts:[...STATE.likedPosts],
      notifications:STATE.notifications
    }));
  }catch(e){ /* ambiente sem acesso a localStorage — segue só com estado em memória */ }
}

const $ = s=>document.querySelector(s);
const $$ = s=>Array.from(document.querySelectorAll(s));
/* (função img() de fotos externas removida — agora tudo usa artScene(), sem internet) */
/* Ilustrações vetoriais próprias (sem depender de internet) para os "cards" de
   eventos/artistas: multidão, palco/microfone, ingresso, pulseira e violão,
   sempre em gradiente rosa/violeta/âmbar. Escolhidas de forma determinística
   a partir do "seed" (mesmo evento sempre pega a mesma ilustração). */
function hashSeed(s){ let h=5381; s=String(s); for(let i=0;i<s.length;i++){ h=((h*33)^s.charCodeAt(i))>>>0; } return h; }
const ART_GRADIENTS = [['#FF3D7F','#8B5CF6'],['#8B5CF6','#FFB238'],['#FFB238','#FF3D7F'],['#FF3D7F','#FFB238'],['#8B5CF6','#FF3D7F']];
let _artCounter = 0;
/* mediaFor: usa uma foto de verdade se "url" for preenchida (ex: a.photoUrl),
   com a ilustração artScene() sempre por baixo como reserva (se a foto não
   carregar, ela simplesmente some e a ilustração aparece no lugar). */
function mediaFor(seed, url, forcedVariant){
  if(!url) return artScene(seed, forcedVariant);
  return `<div style="position:relative;width:100%;height:100%">${artScene(seed, forcedVariant)}<img src="${escapeHtml(url)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()"></div>`;
}
function artScene(seed, forcedVariant){
  const h = hashSeed(seed);
  const [c1,c2] = ART_GRADIENTS[h % ART_GRADIENTS.length];
  const variant = forcedVariant!==undefined ? forcedVariant : h % 5;
  const gid = 'artg'+(_artCounter++)+'_'+(h%9999);
  let content = '';
  if(variant===0){
    content = `<polygon points="60,0 140,0 210,300 -30,300" fill="#fff" opacity="0.12"/>
      <polygon points="220,0 300,0 420,300 180,300" fill="#fff" opacity="0.1"/>
      <polygon points="340,0 400,0 400,300 300,300" fill="#fff" opacity="0.08"/>
      ${Array.from({length:9}).map((_,i)=>{ const cx=20+i*42+((h>>(i%5))&7);
        return `<circle cx="${cx}" cy="230" r="20" fill="#0b0712" opacity="0.9"/><rect x="${cx-9}" y="205" width="18" height="30" rx="8" fill="#0b0712" opacity="0.9"/>`; }).join('')}
      ${Array.from({length:6}).map((_,i)=>`<circle cx="${(h*(i+3))%400}" cy="${20+((h>>i)%60)}" r="${2+(i%3)}" fill="#fff" opacity="0.5"/>`).join('')}`;
  } else if(variant===1){
    content = `<circle cx="200" cy="150" r="110" fill="none" stroke="#fff" opacity="0.12" stroke-width="2"/>
      <circle cx="200" cy="150" r="75" fill="none" stroke="#fff" opacity="0.16" stroke-width="2"/>
      <circle cx="200" cy="150" r="40" fill="none" stroke="#fff" opacity="0.2" stroke-width="2"/>
      <rect x="192" y="150" width="16" height="90" rx="8" fill="#fff" opacity="0.85"/>
      <ellipse cx="200" cy="130" rx="26" ry="34" fill="#fff" opacity="0.9"/>
      <line x1="178" y1="120" x2="222" y2="120" stroke="#0b0712" stroke-width="3" opacity="0.5"/>
      <line x1="178" y1="130" x2="222" y2="130" stroke="#0b0712" stroke-width="3" opacity="0.5"/>
      <line x1="178" y1="140" x2="222" y2="140" stroke="#0b0712" stroke-width="3" opacity="0.5"/>`;
  } else if(variant===2){
    content = `<g transform="rotate(-12 200 150)">
        <rect x="70" y="95" width="260" height="110" rx="14" fill="#fff" opacity="0.92"/>
        <line x1="200" y1="95" x2="200" y2="205" stroke="${c1}" stroke-width="3" stroke-dasharray="6 6"/>
        <circle cx="200" cy="95" r="9" fill="url(#${gid})"/>
        <circle cx="200" cy="205" r="9" fill="url(#${gid})"/>
      </g>
      ${Array.from({length:10}).map((_,i)=>{ const x=(h*(i+2)*7)%400, y=(h*(i+5)*3)%300;
        return `<rect x="${x}" y="${y}" width="8" height="8" fill="#fff" opacity="0.35" transform="rotate(${(h*i)%360} ${x} ${y})"/>`; }).join('')}`;
  } else if(variant===3){
    content = `<g transform="translate(200 150) rotate(-8)">
        <ellipse cx="0" cy="0" rx="120" ry="55" fill="none" stroke="#fff" stroke-width="20" opacity="0.85"/>
        <ellipse cx="0" cy="0" rx="120" ry="55" fill="none" stroke="${c1}" stroke-width="20" opacity="0.5" stroke-dasharray="40 220"/>

/* fallback: se uma foto externa não carregar, esconde o <img> e deixa o

document.addEventListener('error', function(e){
  const el = e.target;
  if(el && el.tagName === 'IMG'){ el.style.display = 'none'; el.dataset.broken = '1'; }
}, true);
function initials(name){ return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DIAS_SEM = ['dom','seg','ter','qua','qui','sex','sáb'];
function parseDate(str){ const [y,m,d]=str.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDateShort(str){ const d=parseDate(str); return `${DIAS_SEM[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]}`; }
function fmtDateLong(str){ const d=parseDate(str); return `${d.getDate()} de ${['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][d.getMonth()]} de ${d.getFullYear()}`; }
function daysUntil(str){ const d=parseDate(str); return Math.round((d-NOW)/86400000); }
function toast(msg){
  const root = $('#toast-root');
  const el = document.createElement('div'); el.className='toast'; el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2400);
}
function notify(title){

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let discoverState = {query:'', genre:'Todos', region:'Todos', city:'Todos', price:'Todos', view:'list', selectedRegion:null, selectedDay:null, calMonth:8, calYear:2026};

function parseHash(){
  const raw = (location.hash||'#/').slice(1);
  const [path, qs] = raw.split('?');
  const segments = path.split('/').filter(Boolean);
  const params = new URLSearchParams(qs||'');
  return {segments, params};
}

function navigate(hash){ location.hash = hash; }

function render(){
  const {segments, params} = parseHash();
  const root = $('#app-root');
  let html = '';
  const seg0 = segments[0];

  if(!seg0){ html = renderHome(); }
  else if(seg0==='discover' || seg0==='events'){
    if(params.get('q')) discoverState.query = params.get('q');
    if(params.get('genre')) discoverState.genre = params.get('genre');
    html = renderDiscover();
  }
  else if(seg0==='event' && segments[1]){ html = renderEventDetail(segments[1]); }
  else if(seg0==='artist' && segments[1]){ html = renderArtistDetail(segments[1]); }
  else if(seg0==='communities'){ html = renderCommunitiesList(); }
  else if(seg0==='community' && segments[1]){ html = renderCommunityDetail(segments[1]); }
  else if(seg0==='meu-role'){ html = renderMeuRole(); }
  else if(seg0==='perfil'){ html = renderProfile(); }
  else if(seg0==='organizador'){ html = renderOrganizerDashboard(); }
  else if(seg0==='admin'){ html = renderAdminDashboard(); }
  else { html = renderNotFound(); }

  root.innerHTML = `<div class="view">${html}</div>`;
  window.scrollTo({top:0,behavior:'instant' in window ? 'instant':'auto'});
  afterRender(seg0);
  updateActiveNav();
}

function renderNotFound(){
  return `<div class="container section"><div class="empty-state"><h3>Página não encontrada</h3><p>Esse rolê ainda não existe por aqui.</p>

}

function filterEvents(){
  const s = discoverState;
  return EVENTS.filter(e=>{
    if(s.query){
      const q = s.query.toLowerCase();
      const hay = (e.title+' '+e.city+' '+e.state+' '+e.genre+' '+e.lineup.map(l=>artistById(l.artistId)?.name).join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(s.genre!=='Todos' && e.genre!==s.genre) return false;
    if(s.region!=='Todos' && REGION_BY_STATE[e.state]!==s.region) return false;
    if(s.city!=='Todos' && e.city!==s.city) return false;
    if(s.price!=='Todos'){
      if(s.price==='ate100' && e.price.min>100) return false;
      if(s.price==='100a250' && (e.price.min<100||e.price.min>250)) return false;
      if(s.price==='250mais' && e.price.min<250) return false;
    }
    return true;
  }).sort((a,b)=>parseDate(a.date)-parseDate(b.date));
}

function renderCalendar(results, ctx){
  ctx = ctx || 'discover';
  const cs = ctx==='meurole' ? meuRoleState : discoverState;
  const y = cs.calYear, m = cs.calMonth;
  const first = new Date(y,m,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const byDay = {};
  results.forEach(e=>{ const d=parseDate(e.date); if(d.getFullYear()===y && d.getMonth()===m){ (byDay[d.getDate()]=byDay[d.getDate()]||[]).push(e); } });
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="calendar-day empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const evs = byDay[day]||[];
    const sel = cs.selectedDay===day;
    cells += `<div class="calendar-day ${evs.length?'has-event':''} ${sel?'selected':''}" data-action="pick-day" data-ctx="${ctx}" data-day="${day}">
      <span>${day}</span>
      <div class="calendar-day-dots">${evs.slice(0,4).map(()=>'<span></span>').join('')}</div>
    </div>`;
  }
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const dayEvents = cs.selectedDay ? (byDay[cs.selectedDay]||[]) : [];
  return `
  <div class="info-card">
    <div class="flex items-center" style="justify-content:space-between;margin-bottom:16px">
      <button class="icon-btn" data-action="cal-prev" data-ctx="${ctx}">‹</button>
      <h3>${monthNames[m]} ${y}</h3>
      <button class="icon-btn" data-action="cal-next" data-ctx="${ctx}">›</button>
    </div>
    <div class="calendar-grid">
      ${DIAS_SEM.map(d=>`<div class="calendar-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  </div>
  ${cs.selectedDay ? `<h3 class="mt-24" style="margin-bottom:12px">Eventos em ${cs.selectedDay}/${m+1}</h3>
  <div class="results-grid">${dayEvents.length?dayEvents.map(eventCard).join(''):'<div class="empty-state">Nenhum evento nesse dia.</div>'}</div>` : ''}
  `;
}
function renderMap(results){
  const counts = {};
  results.forEach(e=>{ const r=REGION_BY_STATE[e.state]; counts[r]=(counts[r]||0)+1; });
  const regionEvents = discoverState.selectedRegion ? results.filter(e=>REGION_BY_STATE[e.state]===discoverState.selectedRegion) : [];
  return `
  <div class="brazil-map">
    ${Object.keys(REGION_LABEL).map(r=>`
      <div class="map-region ${discoverState.selectedRegion===r?'active':''}" data-region="${r}" data-action="pick-region">
        <span class="map-region-label">${REGION_LABEL[r]}</span>
        <span class="map-region-count">${counts[r]||0} evento(s)</span>
      </div>`).join('')}
  </div>
  ${discoverState.selectedRegion ? `
  <div class="map-events-list">
    ${regionEvents.length ? regionEvents.map(e=>`
      <div class="map-event-row" data-action="quick-preview" data-id="${e.id}">
        <div style="width:56px;height:56px;border-radius:10px;overflow:hidden;flex:none">${artScene(e.cover)}</div>
        <div class="mer-info"><div class="mer-title">${escapeHtml(e.title)}</div><div class="mer-meta">${fmtDateShort(e.date)} · ${e.city}, ${e.state}</div></div>
        <svg viewBox="0 0 24 24" width="16" height="16" style="stroke:var(--text-faint);fill:none;stroke-width:2"><path d="m9 6 6 6-6 6"/></svg>
      </div>`).join('') : '<div class="empty-state">Nenhum evento nessa região com os filtros atuais.</div>'}
  </div>` : `<p class="text-muted mt-24">Selecione uma região do mapa para ver os eventos disponíveis.</p>`}
  `;
}

function renderEventDetail(id){
  const ev = EVENTS.find(e=>e.id===id);

function renderArtistDetail(id){
  const a = artistById(id);
  if(!a) return renderNotFound();
  const following = STATE.following.has(a.id);
  const tab = artistTab[a.id] || 'eventos';
  const upcoming = EVENTS.filter(e=>e.lineup.some(l=>l.artistId===a.id) && parseDate(e.date)>=NOW).sort((x,y)=>parseDate(x.date)-parseDate(y.date));
  const posts = POSTS.filter(p=>p.artistId===a.id).slice(0,2);

  let tabContent = '';
  if(tab==='eventos'){
    tabContent = upcoming.length ? `<div class="results-grid">${upcoming.map(eventCard).join('')}</div>` : `<div class="empty-state"><h3>Sem shows marcados</h3><p>Siga o artista para ser avisado assim que um novo show for anunciado.</p></div>`;
  } else if(tab==='discografia'){
    tabContent = a.discography.map(d=>`<div class="discog-row"><div style="width:52px;height:52px;border-radius:10px;overflow:hidden;flex:none">${artScene(a.photo+d.title)}</div><div><b style="font-size:14px">${escapeHtml(d.title)}</b><div class="text-muted" style="font-size:12px">${d.type} · ${d.year}</div></div></div>`).join('');
  } else {
    tabContent = `<div id="artist-community-preview">${posts.map(postCard).join('')}</div><a class="btn btn-secondary mt-8" data-route="#/community/${a.id}">Ver comunidade completa</a>`;
  }

  return `
  <div class="container">
    <div class="artist-hero">
      <div class="artist-hero-photo">${mediaFor(a.photo, a.photoUrl, a.sceneVariant)}</div>
      <div>
        <span class="badge-pill badge-violet">${a.genre}</span>
        <h1 style="margin-top:8px;font-size:clamp(24px,3.6vw,34px)">${escapeHtml(a.name)}</h1>
        <p class="text-muted" style="max-width:560px;margin-top:6px;font-size:13.5px">${escapeHtml(a.bio)}</p>
        <div class="artist-stats">
          <div class="artist-stat"><b>${(a.fans/1000).toFixed(0)}k</b><span>fãs na plataforma</span></div>
          <div class="artist-stat"><b>${upcoming.length}</b><span>shows agendados</span></div>
          <div class="artist-stat"><b>${a.discography.length}</b><span>lançamentos</span></div>
        </div>
        <button class="btn ${following?'btn-active':'btn-primary'}" data-action="toggle-follow" data-id="${a.id}">${following?'Seguindo ✓':'Seguir artista'}</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn ${tab==='eventos'?'active':''}" data-action="artist-tab" data-artist="${a.id}" data-tab="eventos">Próximos eventos</button>
      <button class="tab-btn ${tab==='discografia'?'active':''}" data-action="artist-tab" data-artist="${a.id}" data-tab="discografia">Discografia</button>
      <button class="tab-btn ${tab==='comunidade'?'active':''}" data-action="artist-tab" data-artist="${a.id}" data-tab="comunidade">Comunidade</button>
    </div>
    <div id="artist-tab-content">${tabContent}</div>
  </div>`;
}

          <button class="btn ${STATE.following.has(a.id)?'btn-active':'btn-secondary'} btn-sm mt-8" data-action="toggle-follow" data-id="${a.id}">${STATE.following.has(a.id)?'Seguindo':'Seguir'}</button>

function renderMeuRole(){
  if(!STATE.user){
    return `<div class="container section"><div class="empty-state"><h3>Entre para ver seu Meu Rolê</h3><p>Salve eventos e marque interesse para montar sua agenda pessoal.</p>
    <button class="btn btn-primary mt-16" data-action="open-auth" data-tab="login">Entrar</button></div></div>`;
  }
  const list = currentMeuRoleList();
  return `
  <div class="container">
    <div class="page-banner"><h1>Meu Rolê</h1><p>Seus eventos salvos e com interesse confirmado, organizados por data.</p></div>
    <div class="filters-bar">
      <div class="view-toggle">
        <button data-action="set-meurole-view" data-view="list" class="${meuRoleState.view==='list'?'active':''}">Lista</button>
        <button data-action="set-meurole-view" data-view="calendar" class="${meuRoleState.view==='calendar'?'active':''}">Calendário</button>
      </div>
    </div>
    <div id="meurole-results">${renderMeuRoleContent(list)}</div>
  </div>`;
}
function currentMeuRoleList(){
  const ids = new Set([...STATE.favorites, ...STATE.interested]);
  return EVENTS.filter(e=>ids.has(e.id)).sort((a,b)=>parseDate(a.date)-parseDate(b.date));
}
function refreshMeuRoleUI(){
  const el = $('#meurole-results');
  if(el) el.innerHTML = renderMeuRoleContent(currentMeuRoleList());
}
function renderMeuRoleContent(list){
  if(list.length===0) return `<div class="empty-state"><h3>Sua agenda está vazia</h3><p>Explore o Descobrir e salve eventos ou marque interesse para vê-los aqui.</p><a class="btn btn-primary mt-16" data-route="#/discover">Descobrir eventos</a></div>`;
  if(meuRoleState.view==='calendar'){
    return renderCalendar(list,'meurole');
  }
  return `<div style="display:flex;flex-direction:column;gap:12px">${list.map(ev=>{
    const d = daysUntil(ev.date);
    const dLabel = d<0 ? 'Já rolou' : d===0 ? 'É hoje!' : `Faltam ${d} dia${d===1?'':'s'}`;
    return `
    <div class="map-event-row" style="padding:14px">
      <div style="width:70px;height:70px;border-radius:12px;overflow:hidden;flex:none" data-open-event="${ev.id}">${artScene(ev.cover)}</div>
      <div class="mer-info" data-open-event="${ev.id}" style="cursor:pointer">
        <div class="mer-title">${escapeHtml(ev.title)}</div>
        <div class="mer-meta">${fmtDateShort(ev.date)} · ${ev.city}, ${ev.state}</div>
        <span class="badge-pill badge-pink mt-8" style="margin-top:6px">${dLabel}</span>
      </div>
      <button class="icon-btn" data-action="remove-role" data-id="${ev.id}" aria-label="Remover" title="Remover da agenda">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>`; }).join('')}</div>`;
}

        <div class="pick-grid">${ARTISTS.map(a=>`<label class="pick-chip" style="cursor:pointer"><input type="checkbox" name="artists" value="${a.id}" style="margin-right:6px">${a.name}</label>`).join('')}</div>

    </form>

}

/* ---------------------------------------------------------
   15) MODAL DE AUTENTICAÇÃO / ONBOARDING
   --------------------------------------------------------- */
let authStep = 1;
let signupDraft = {name:'',username:'',genres:[],artists:[],city:'',state:''};

function openAuthModal(tab){
  authStep = 1;
  signupDraft = {name:'',username:'',genres:[],artists:[],city:'',state:''};
  $('#overlay').hidden = false;
  const modal = $('#auth-modal'); modal.hidden = false;
  renderAuthModal(tab||'login');
}
function closeAuthModal(){ $('#auth-modal').hidden = true; $('#overlay').hidden = true; }
function renderAuthModal(tab){
  const card = $('#auth-modal-card');
  if(tab==='login'){
    card.innerHTML = `
    <div class="auth-head"><div class="auth-tabs"><button class="active" data-action="auth-switch" data-tab="login">Entrar</button><button data-action="auth-switch" data-tab="signup">Cadastrar</button></div></div>
    <div class="auth-body">
      <form data-action="do-login">
        <div class="form-group"><label>Nome</label><input name="name" required placeholder="Como podemos te chamar?"></div>
        <div class="form-group"><label>Cidade de referência</label><input name="city" required placeholder="Ex: São Paulo"></div>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      </form>
      <button class="btn btn-secondary btn-block mt-8" data-action="demo-login">Entrar com conta demo</button>
    </div>`;
  } else {
    card.innerHTML = renderSignupStep();
  }
}
function renderSignupStep(){
  const progress = [1,2,3,4].map(i=>`<span class="${authStep>=i?'done':''}"></span>`).join('');
  let body = '';
  if(authStep===1){
    body = `
    <div class="form-group"><label>Nome completo</label><input id="su-name" value="${signupDraft.name}" placeholder="Seu nome"></div>
    <div class="form-group"><label>Nome de usuário</label><input id="su-username" value="${signupDraft.username}" placeholder="@usuario"></div>
    <button class="btn btn-primary btn-block mt-8" data-action="signup-next">Continuar</button>`;
  } else if(authStep===2){
    body = `
    <p class="text-muted" style="font-size:13px;margin-bottom:10px">Quais gêneros musicais você curte?</p>
    <div class="pick-grid">${GENRES.map(g=>`<button type="button" class="pick-chip ${signupDraft.genres.includes(g)?'active':''}" data-action="toggle-draft-genre" data-genre="${g}">${g}</button>`).join('')}</div>
    <button class="btn btn-primary btn-block mt-16" data-action="signup-next">Continuar</button>`;
  } else if(authStep===3){
    body = `
    <p class="text-muted" style="font-size:13px;margin-bottom:10px">Quais artistas você já acompanha?</p>
    <div class="pick-grid">${ARTISTS.map(a=>`<button type="button" class="pick-chip ${signupDraft.artists.includes(a.id)?'active':''}" data-action="toggle-draft-artist" data-id="${a.id}">${a.name}</button>`).join('')}</div>
    <button class="btn btn-primary btn-block mt-16" data-action="signup-next">Continuar</button>`;
  } else {
    body = `
    <div class="form-group"><label>Cidade de referência</label><input id="su-city" value="${signupDraft.city}" placeholder="Ex: Recife"></div>
    <div class="form-group"><label>Estado (UF)</label><input id="su-state" maxlength="2" value="${signupDraft.state}" placeholder="Ex: PE"></div>
    <button class="btn btn-primary btn-block mt-8" data-action="signup-finish">Criar minha conta</button>`;
  }
  return `
  <div class="auth-head"><div class="auth-tabs"><button data-action="auth-switch" data-tab="login">Entrar</button><button class="active" data-action="auth-switch" data-tab="signup">Cadastrar</button></div></div>
  <div class="auth-body"><div class="onboard-progress">${progress}</div>${body}</div>`;
}

/* ---------------------------------------------------------
   16) PRÉVIA RÁPIDA (mapa/calendário)

/* ---------------------------------------------------------
   17) NOTIFICAÇÕES / TEMA / NAV
   --------------------------------------------------------- */
function renderNotifBadge(){
  const unread = STATE.notifications.filter(n=>n.unread).length;
  const badge = $('#notif-badge');
  badge.hidden = unread===0; badge.textContent = unread;
}
function renderNotifPanel(){
  const list = $('#notif-list');
  list.innerHTML = STATE.notifications.length ? STATE.notifications.map(n=>`
    <div class="notif-item ${n.unread?'unread':''}">
      <span class="ni-icon"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg></span>
      <div><div class="ni-title">${escapeHtml(n.title)}</div><div class="ni-time">${n.time}</div></div>
    </div>`).join('') : `<div class="empty-state">Nenhuma notificação por aqui ainda.</div>`;
  STATE.notifications.forEach(n=>n.unread=false);
  persist();
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', STATE.theme);
}
function updateActiveNav(){
  const hash = location.hash || '#/';
  $$('.nav-link, .nav-mobile-link').forEach(el=>{
    const r = el.getAttribute('data-route');
    const active = r==='#/' ? (hash==='#/'||hash==='') : hash.startsWith(r.split('?')[0]);
    el.classList.toggle('active', !!active);
  });
  const chip = $('#user-chip-label');
  const avatar = $('#user-avatar');
  if(STATE.user){ chip.textContent = STATE.user.name.split(' ')[0]; avatar.textContent = initials(STATE.user.name); }
  else { chip.textContent = 'Entrar'; avatar.textContent = '?'; }
}

function afterRender(routeKey){
  if(routeKey==='discover' || routeKey==='events'){ renderDiscoverResults(); }
  if(routeKey==='meu-role'){
    /* já renderizado no HTML inicial */
  }

/* ---------------------------------------------------------
   19) EVENT DELEGATION (clique / submit / mudança global)
   --------------------------------------------------------- */
document.addEventListener('click', function(e){
  const routeEl = e.target.closest('[data-route]');
  if(routeEl){ e.preventDefault(); closeModals(); navigate(routeEl.getAttribute('data-route')); return; }

  const openEvent = e.target.closest('[data-open-event]');
  if(openEvent){ navigate('#/event/'+openEvent.getAttribute('data-open-event')); return; }
  const openArtist = e.target.closest('[data-open-artist]');
  if(openArtist){ navigate('#/artist/'+openArtist.getAttribute('data-open-artist')); return; }
  const openCommunity = e.target.closest('[data-open-community]');
  if(openCommunity){ navigate('#/community/'+openCommunity.getAttribute('data-open-community')); return; }

  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.getAttribute('data-action');

  switch(action){
    case 'toggle-save': {
      const id = t.getAttribute('data-id');
      requireAuth('Entre para salvar eventos na sua agenda', ()=>{
        if(STATE.favorites.has(id)){ STATE.favorites.delete(id); toast('Removido dos salvos'); }
        else { STATE.favorites.add(id); toast('Evento salvo em Meu Rolê ✓'); }
        persist(); render();
      });
      break; }
    case 'toggle-interest': {
      const id = t.getAttribute('data-id');
      requireAuth('Entre para marcar interesse', ()=>{
        if(STATE.interested.has(id)){ STATE.interested.delete(id); toast('Interesse removido'); }
        else { STATE.interested.add(id); toast('Interesse confirmado ✓'); }
        persist(); render();
      });
      break; }
    case 'remove-role': {
      const id = t.getAttribute('data-id');
      STATE.favorites.delete(id); STATE.interested.delete(id); persist(); toast('Removido do Meu Rolê'); render();
      break; }
    case 'toggle-follow': {
      const id = t.getAttribute('data-id');
      requireAuth('Entre para seguir artistas', ()=>{
        const a = artistById(id);
        if(STATE.following.has(id)){ STATE.following.delete(id); toast('Deixou de seguir '+a.name); }
        else { STATE.following.add(id); toast('Agora você segue '+a.name+' ✓'); }
        persist(); render();
      });
      break; }
    case 'toggle-like': {
      const id = t.getAttribute('data-id');
      requireAuth('Entre para curtir publicações', ()=>{
        if(STATE.likedPosts.has(id)) STATE.likedPosts.delete(id); else STATE.likedPosts.add(id);
        persist(); render();
      });
      break; }
    case 'toggle-comments': {
      const box = document.getElementById('comments-'+t.getAttribute('data-id'));
      if(box) box.classList.toggle('hidden');
      break; }
    case 'share-post': case 'share-event': {
      toast('Link copiado para a área de transferência 🔗');
      break; }
    case 'clear-query': {
      discoverState.query = ''; render();
      break; }
    case 'set-genre': {
      discoverState.genre = t.getAttribute('data-genre');
      $$('#genre-chip-row .genre-chip').forEach(c=>c.classList.toggle('active', c===t));
      renderDiscoverResults();
      break; }
    case 'set-discover-view': {
      discoverState.view = t.getAttribute('data-view');
      $$('.view-toggle button').forEach(b=>{ if(b.parentElement===t.parentElement) b.classList.toggle('active', b===t); });
      renderDiscoverResults();
      break; }
    case 'set-meurole-view': {
      meuRoleState.view = t.getAttribute('data-view');
      render();
      break; }
    case 'pick-day': {
      const ctxD = t.getAttribute('data-ctx')||'discover';
      const csD = ctxD==='meurole' ? meuRoleState : discoverState;
      csD.selectedDay = Number(t.getAttribute('data-day'));
      ctxD==='meurole' ? refreshMeuRoleUI() : renderDiscoverResults();
      break; }
    case 'cal-prev': {
      const ctxP = t.getAttribute('data-ctx')||'discover';
      const csP = ctxP==='meurole' ? meuRoleState : discoverState;
      csP.calMonth--; if(csP.calMonth<0){csP.calMonth=11; csP.calYear--;}
      csP.selectedDay=null;
      ctxP==='meurole' ? refreshMeuRoleUI() : renderDiscoverResults();
      break; }
    case 'cal-next': {
      const ctxN = t.getAttribute('data-ctx')||'discover';
      const csN = ctxN==='meurole' ? meuRoleState : discoverState;
      csN.calMonth++; if(csN.calMonth>11){csN.calMonth=0; csN.calYear++;}
      csN.selectedDay=null;
      ctxN==='meurole' ? refreshMeuRoleUI() : renderDiscoverResults();
      break; }
    case 'pick-region': {
      const r = t.getAttribute('data-region');
      discoverState.selectedRegion = discoverState.selectedRegion===r ? null : r;
      renderDiscoverResults();
      break; }
    case 'quick-preview': openQuickPreview(t.getAttribute('data-id')); break;
    case 'close-modals': closeModals(); break;
    case 'artist-tab': {
      artistTab[t.getAttribute('data-artist')] = t.getAttribute('data-tab');
      render();
      break; }
    case 'community-cat': {
      communityFilter[t.getAttribute('data-artist')] = t.getAttribute('data-cat');
      render();
      break; }
    case 'admin-tab': {
      adminTab = t.getAttribute('data-tab');
      $('#admin-content').innerHTML = renderAdminTabContent();
      $$('.dash-side a').forEach(a=>a.classList.toggle('active', a===t));
      break; }
    case 'toggle-user-status': {
      const u = MOCK_USERS.find(x=>x.id===t.getAttribute('data-id'));
      if(u){ u.status = u.status==='Ativo' ? 'Suspenso' : 'Ativo'; toast('Status de '+u.name+' atualizado'); $('#admin-content').innerHTML = renderAdminTabContent(); }
      break; }
    case 'remove-post': {
      POSTS = POSTS.filter(p=>p.id!==t.getAttribute('data-id'));
      toast('Publicação removida'); $('#admin-content').innerHTML = renderAdminTabContent();
      break; }
    case 'open-auth': openAuthModal(t.getAttribute('data-tab')); break;
    case 'auth-switch': renderAuthModal(t.getAttribute('data-tab')); break;
    case 'demo-login': {
      STATE.user = {name:'Fã Demo', username:'fademo', city:'São Paulo', state:'SP', genres:['Sertanejo','Pop','Funk'], bio:'Explorando o Rolezeiro em modo demonstração.'};
      STATE.following = new Set(['a1','a6','a13']);
      persist(); closeAuthModal(); toast('Bem-vindo(a) de volta!'); render();
      break; }
    case 'signup-next': {
      if(authStep===1){
        const name = document.getElementById('su-name').value.trim();
        const username = document.getElementById('su-username').value.trim().replace(/^@/,'');
        if(!name){ toast('Digite seu nome para continuar'); break; }
        signupDraft.name = name; signupDraft.username = username || name.toLowerCase().replace(/\s+/g,'');
      }
      authStep = Math.min(4, authStep+1);
      renderAuthModal('signup');
      break; }
    case 'toggle-draft-genre': {
      const g = t.getAttribute('data-genre');
      signupDraft.genres = signupDraft.genres.includes(g) ? signupDraft.genres.filter(x=>x!==g) : [...signupDraft.genres,g];
      renderAuthModal('signup');
      break; }
    case 'toggle-draft-artist': {
      const id = t.getAttribute('data-id');
      signupDraft.artists = signupDraft.artists.includes(id) ? signupDraft.artists.filter(x=>x!==id) : [...signupDraft.artists,id];
      renderAuthModal('signup');
      break; }
    case 'signup-finish': {
      const city = document.getElementById('su-city').value.trim() || 'São Paulo';
      const state = (document.getElementById('su-state').value.trim() || 'SP').toUpperCase();
      STATE.user = {name:signupDraft.name, username:signupDraft.username, city, state, genres:signupDraft.genres, bio:'Fã de música em busca do próximo rolê.'};
      signupDraft.artists.forEach(id=>STATE.following.add(id));
      persist(); closeAuthModal(); toast('Conta criada! Bem-vindo(a) ao Rolezeiro 🎟️'); render();
      break; }
    case 'logout': {
      STATE.user = null; persist(); toast('Você saiu da sua conta'); render();
      break; }
  }
});

document.addEventListener('change', function(e){
  const t = e.target;
  if(t.id==='filter-region'){ discoverState.region = t.value; renderDiscoverResults(); }
  if(t.id==='filter-city'){ discoverState.city = t.value; renderDiscoverResults(); }
  if(t.id==='filter-price'){ discoverState.price = t.value; renderDiscoverResults(); }
});

document.addEventListener('submit', function(e){
  const form = e.target;
  const action = form.getAttribute('data-action');
  if(!action) return;
  e.preventDefault();
  if(action==='do-login'){
    const name = form.name.value.trim(); const city = form.city.value.trim();
    STATE.user = {name, username:name.toLowerCase().replace(/\s+/g,''), city, state:'SP', genres:[], bio:''};
    persist(); closeAuthModal(); toast('Bem-vindo(a), '+name.split(' ')[0]+'!'); render();
  }
  if(action==='new-post'){
    requireAuth('Entre para publicar na comunidade', ()=>{
      const artistId = form.getAttribute('data-artist');
      const text = form.querySelector('textarea').value.trim();
      if(!text) return;
      POSTS.unshift({id:'p'+Date.now(), artistId, category:'Conversas', author:STATE.user.name, authorAvatar:'fan-generic', time:'agora', text, likes:0, liked:false, comments:[]});
      form.querySelector('textarea').value='';
      toast('Publicado na comunidade ✓'); render();
    });
  }
  if(action==='add-comment'){
    const id = form.getAttribute('data-id');
    const input = form.querySelector('input');
    const text = input.value.trim(); if(!text) return;
    const p = POSTS.find(p=>p.id===id);
    p.comments.push({author: STATE.user? STATE.user.name : 'Você', text});
    input.value=''; render();
  }
  if(action==='create-event'){
    const fd = new FormData(form);
    const artists = fd.getAll('artists');
    const id = 'e'+Date.now();
    const newEv = {
      id, title: fd.get('title'), type: fd.get('type'), genre: fd.get('genre'),
      city: fd.get('city'), state: (fd.get('state')||'SP').toUpperCase(), date: fd.get('date') || '2026-12-01',
      time: fd.get('time') || '20:00', venue: fd.get('venue'), price:{min:80,max:220},
      cover:'novo-evento-'+id, classification: fd.get('classification')||'Livre', interested:0, featured:false,
      ticketsUrl: fd.get('ticketsUrl') || '#',
      description: fd.get('description') || 'Evento cadastrado pela produtora.',
      lineup: artists.length ? artists.map(aid=>({artistId:aid,time:fd.get('time')||'20:00'})) : []
    };
    EVENTS.unshift(newEv);
    toast('Evento cadastrado com sucesso ✓');
    render();
  }
});

/* botões de ícone / painéis / tema / busca global */
$('#btn-theme').addEventListener('click', ()=>{
  STATE.theme = STATE.theme==='dark' ? 'light' : 'dark';
  applyTheme(); persist();
});
$('#btn-notifs').addEventListener('click', ()=>{

});

  if(STATE.user) navigate('#/perfil'); else openAuthModal('login');
});
$('#btn-mobile-menu').addEventListener('click', ()=>{
  $('#overlay').hidden=false; $('#mobile-menu-drawer').hidden=false;
});
$('#overlay').addEventListener('click', closeModals);
$('#global-search-form').addEventListener('submit', function(e){
  e.preventDefault();
  const q = $('#global-search-input').value.trim();
  discoverState.query = q;
  navigate('#/discover');
  if(location.hash==='#/discover') { discoverState.query=q; render(); }
});

window.addEventListener('hashchange', render);
applyTheme();
renderNotifBadge();
render();

})();
